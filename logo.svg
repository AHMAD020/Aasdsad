<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-label="FELFOUL Falafel Logo">
  <defs>
    <radialGradient id="badgeBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFF8E2"/>
      <stop offset="100%" stop-color="#F0C878"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#9E1F2D"/>
    </linearGradient>
    <linearGradient id="ribbonDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9E1F2D"/>
      <stop offset="100%" stop-color="#5C0F19"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFD400"/>
      <stop offset="60%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7C89A"/>
      <stop offset="100%" stop-color="#D89968"/>
    </linearGradient>
    <linearGradient id="falafel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B37A2E"/>
      <stop offset="100%" stop-color="#6F3F0F"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ED957"/>
      <stop offset="100%" stop-color="#2E7A3A"/>
    </linearGradient>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#DAD3C0"/>
    </linearGradient>
  </defs>

  <!-- Outer decorative flame ring -->
  <circle cx="350" cy="350" r="335" fill="#111"/>
  <circle cx="350" cy="350" r="320" fill="url(#flame)"/>
  <circle cx="350" cy="350" r="298" fill="#111"/>

  <!-- Main cream badge -->
  <ellipse cx="350" cy="340" rx="275" ry="265" fill="url(#badgeBg)"/>
  <ellipse cx="350" cy="340" rx="275" ry="265" fill="none" stroke="#E63946" stroke-width="8"/>
  <ellipse cx="350" cy="340" rx="258" ry="248" fill="none" stroke="#E63946" stroke-width="2" stroke-dasharray="4 6" opacity="0.7"/>

  <!-- Top arch text: FALAFEL -->
  <path id="topArc" d="M 130 350 A 220 220 0 0 1 570 350" fill="none"/>
  <text font-family="'Impact', 'Arial Black', sans-serif" font-size="72" font-weight="900" fill="#E63946" stroke="#111" stroke-width="3.5" paint-order="stroke fill" letter-spacing="12">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">FALAFEL</textPath>
  </text>

  <!-- Small stars beside title -->
  <g fill="#E63946">
    <path d="M120 250 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M580 250 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  </g>

  <!-- ===== CHEF MASCOT ===== -->
  <g transform="translate(350 400)">
    <!-- Chef hat -->
    <g>
      <ellipse cx="0" cy="-90" rx="70" ry="20" fill="#ffffff" stroke="#111" stroke-width="4"/>
      <path d="M-70 -90 Q -95 -150 -45 -160 Q -30 -205 5 -180 Q 35 -210 55 -175 Q 100 -155 70 -90 Z" fill="#ffffff" stroke="#111" stroke-width="4"/>
      <path d="M-45 -160 Q -38 -150 -25 -155 M 5 -180 Q 12 -170 22 -175 M 40 -195 Q 44 -185 55 -185" stroke="#e2e2e2" stroke-width="2.5" fill="none"/>
      <!-- Hat band -->
      <rect x="-70" y="-80" width="140" height="8" fill="#E63946" stroke="#111" stroke-width="2"/>
    </g>

    <!-- Head/face -->
    <g>
      <!-- Ears -->
      <ellipse cx="-52" cy="-30" rx="10" ry="14" fill="url(#skin)" stroke="#111" stroke-width="3"/>
      <ellipse cx="52" cy="-30" rx="10" ry="14" fill="url(#skin)" stroke="#111" stroke-width="3"/>
      <!-- Face -->
      <ellipse cx="0" cy="-30" rx="55" ry="60" fill="url(#skin)" stroke="#111" stroke-width="4"/>
      <!-- Cheeks -->
      <ellipse cx="-35" cy="-8" rx="10" ry="6" fill="#FF8A8A" opacity="0.55"/>
      <ellipse cx="35" cy="-8" rx="10" ry="6" fill="#FF8A8A" opacity="0.55"/>
      <!-- Eyes -->
      <ellipse cx="-18" cy="-38" rx="6" ry="8" fill="#fff" stroke="#111" stroke-width="2"/>
      <ellipse cx="18" cy="-38" rx="6" ry="8" fill="#fff" stroke="#111" stroke-width="2"/>
      <circle cx="-17" cy="-36" r="3.5" fill="#2A3D66"/>
      <circle cx="19" cy="-36" r="3.5" fill="#2A3D66"/>
      <circle cx="-16" cy="-37" r="1.2" fill="#fff"/>
      <circle cx="20" cy="-37" r="1.2" fill="#fff"/>
      <!-- Brows -->
      <path d="M-28 -50 Q -18 -55 -10 -50" stroke="#3A2418" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M10 -50 Q 18 -55 28 -50" stroke="#3A2418" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Moustache -->
      <path d="M-22 -12 Q -12 -6 0 -10 Q 12 -6 22 -12 Q 12 0 0 -4 Q -12 0 -22 -12 Z" fill="#3A2418" stroke="#111" stroke-width="1.5"/>
      <!-- Smile -->
      <path d="M-14 5 Q 0 18 14 5" stroke="#111" stroke-width="3" fill="#B93B3B" stroke-linejoin="round"/>
      <!-- Chin dot -->
      <circle cx="0" cy="22" r="2" fill="#8A5A20"/>
    </g>

    <!-- Neckerchief -->
    <g>
      <path d="M-55 30 Q 0 45 55 30 L 40 60 Q 0 68 -40 60 Z" fill="url(#ribbon)" stroke="#111" stroke-width="3"/>
      <path d="M-8 42 L 0 65 L 8 42 Z" fill="url(#ribbonDark)" stroke="#111" stroke-width="2"/>
    </g>

    <!-- Body / chef coat -->
    <g>
      <path d="M-95 55 Q -80 45 -55 40 L 55 40 Q 80 45 95 55 L 100 130 L -100 130 Z" fill="#ffffff" stroke="#111" stroke-width="4"/>
      <!-- Buttons -->
      <circle cx="-15" cy="80" r="4" fill="#E63946" stroke="#111" stroke-width="1.5"/>
      <circle cx="15" cy="80" r="4" fill="#E63946" stroke="#111" stroke-width="1.5"/>
      <circle cx="-15" cy="110" r="4" fill="#E63946" stroke="#111" stroke-width="1.5"/>
      <circle cx="15" cy="110" r="4" fill="#E63946" stroke="#111" stroke-width="1.5"/>
      <!-- Coat fold -->
      <path d="M0 45 L 0 130" stroke="#c8c8c8" stroke-width="2"/>
    </g>

    <!-- Left arm (thumbs up) -->
    <g>
      <path d="M-95 55 Q -140 70 -155 40 L -140 20 Q -125 30 -95 55 Z" fill="#ffffff" stroke="#111" stroke-width="4"/>
      <!-- Hand -->
      <circle cx="-155" cy="25" r="16" fill="url(#skin)" stroke="#111" stroke-width="3"/>
      <!-- Thumb -->
      <path d="M-155 8 Q -152 -5 -160 -12 Q -168 -5 -166 8 Z" fill="url(#skin)" stroke="#111" stroke-width="3"/>
    </g>

    <!-- Right arm holding plate -->
    <g>
      <path d="M95 55 Q 140 70 155 45 L 160 100 L 120 100 Z" fill="#ffffff" stroke="#111" stroke-width="4"/>
      <circle cx="155" cy="95" r="14" fill="url(#skin)" stroke="#111" stroke-width="3"/>
    </g>

    <!-- Plate with falafel wrap -->
    <g transform="translate(115 95)">
      <ellipse cx="0" cy="20" rx="80" ry="14" fill="url(#plate)" stroke="#111" stroke-width="3"/>
      <ellipse cx="0" cy="15" rx="80" ry="14" fill="url(#plate)" stroke="#111" stroke-width="3"/>
      <!-- Wrap -->
      <path d="M-55 15 Q -60 -20 -30 -25 L 40 -25 Q 65 -20 55 15 Z" fill="#E8C88A" stroke="#111" stroke-width="3"/>
      <!-- Filling: greens, tomato, falafel -->
      <ellipse cx="-25" cy="-15" rx="14" ry="6" fill="url(#green)" stroke="#111" stroke-width="1.5"/>
      <ellipse cx="10" cy="-18" rx="14" ry="6" fill="url(#green)" stroke="#111" stroke-width="1.5"/>
      <circle cx="-10" cy="-8" r="8" fill="url(#falafel)" stroke="#111" stroke-width="1.5"/>
      <circle cx="15" cy="-6" r="7" fill="url(#falafel)" stroke="#111" stroke-width="1.5"/>
      <circle cx="30" cy="-14" r="6" fill="#E63946" stroke="#111" stroke-width="1.5"/>
      <!-- Sesame dots -->
      <g fill="#8A5A20">
        <circle cx="-10" cy="-8" r="1.5"/>
        <circle cx="-6" cy="-11" r="1.2"/>
        <circle cx="15" cy="-6" r="1.5"/>
      </g>
    </g>
  </g>

  <!-- ===== BOTTOM RIBBON: FELFOUL ===== -->
  <g transform="translate(350 590)">
    <!-- Ribbon body -->
    <path d="M-210 -30 L 210 -30 L 235 0 L 210 30 L -210 30 L -235 0 Z" fill="url(#ribbon)" stroke="#111" stroke-width="4"/>
    <!-- Ribbon tails -->
    <path d="M-210 30 L -230 55 L -190 30 Z" fill="url(#ribbonDark)" stroke="#111" stroke-width="2.5"/>
    <path d="M210 30 L 230 55 L 190 30 Z" fill="url(#ribbonDark)" stroke="#111" stroke-width="2.5"/>
    <!-- Inner border -->
    <path d="M-200 -22 L 200 -22 L 220 0 L 200 22 L -200 22 L -220 0 Z" fill="none" stroke="#FFD400" stroke-width="2" stroke-dasharray="3 5" opacity="0.9"/>
    <!-- Text -->
    <text x="0" y="12" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="66" font-weight="900" fill="#ffffff" letter-spacing="8" stroke="#111" stroke-width="2.5" paint-order="stroke fill">FELFOUL</text>
  </g>

  <!-- Decorative parsley leaves -->
  <g fill="url(#green)" stroke="#245826" stroke-width="1.5">
    <ellipse cx="100" cy="380" rx="16" ry="9" transform="rotate(-30 100 380)"/>
    <ellipse cx="600" cy="380" rx="16" ry="9" transform="rotate(30 600 380)"/>
  </g>
  <!-- Yellow dots -->
  <g fill="#FFD400">
    <circle cx="140" cy="250" r="6"/>
    <circle cx="560" cy="250" r="6"/>
    <circle cx="100" cy="500" r="5"/>
    <circle cx="600" cy="500" r="5"/>
  </g>
</svg>
