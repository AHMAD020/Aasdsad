<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1131" width="800" height="1131" role="img" aria-label="BUZZ Festival Flyer – FELFOUL Foodtruck">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150029"/>
      <stop offset="45%" stop-color="#4a1466"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD400"/>
      <stop offset="55%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF3EA5"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#8E1926"/>
    </linearGradient>
    <linearGradient id="falafel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B37A2E"/>
      <stop offset="100%" stop-color="#6F3F0F"/>
    </linearGradient>
    <linearGradient id="slush" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3EA5"/>
      <stop offset="60%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#00E0D5"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ED957"/>
      <stop offset="100%" stop-color="#2E7A3A"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E2"/>
      <stop offset="100%" stop-color="#F4E1B0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="1131" fill="url(#bg)"/>

  <!-- Soft glowing blobs -->
  <circle cx="120" cy="150" r="200" fill="#7A5CFF" opacity="0.6" filter="url(#glow)"/>
  <circle cx="720" cy="220" r="160" fill="#00E0D5" opacity="0.5" filter="url(#glow)"/>
  <circle cx="760" cy="960" r="220" fill="#FF3EA5" opacity="0.55" filter="url(#glow)"/>
  <circle cx="60" cy="900" r="180" fill="#FFD400" opacity="0.4" filter="url(#glow)"/>

  <!-- Confetti -->
  <g opacity="0.9">
    <circle cx="90" cy="380" r="5" fill="#FFD400"/>
    <circle cx="720" cy="480" r="6" fill="#FFD400"/>
    <circle cx="60" cy="620" r="4" fill="#FFD400"/>
    <circle cx="200" cy="60" r="4" fill="#00E0D5"/>
    <circle cx="600" cy="60" r="5" fill="#00E0D5"/>
    <circle cx="150" cy="1085" r="5" fill="#00E0D5"/>
    <path d="M180 190 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#FFD400"/>
    <path d="M640 230 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" fill="#FFD400"/>
    <path d="M130 780 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z" fill="#FF3EA5"/>
  </g>

  <!-- ===== TOP: Date & location ===== -->
  <g transform="translate(400 65)" text-anchor="middle" font-family="Verdana, 'Trebuchet MS', sans-serif">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#111" opacity="0.35"/>
    <text y="8" font-size="18" font-weight="800" fill="#FFD400" letter-spacing="8">15 &#8211; 17 AUGUST 2026</text>
  </g>

  <!-- ===== BUZZ FESTIVAL TITLE ===== -->
  <g font-family="Verdana, 'Trebuchet MS', sans-serif" font-weight="900" text-anchor="middle" filter="url(#softShadow)">
    <text x="400" y="215" font-size="150" fill="url(#titleGrad)" letter-spacing="6" transform="rotate(-2 400 195)">BUZZ</text>
    <text x="400" y="278" font-size="46" fill="#ffffff" letter-spacing="14" font-weight="800">FESTIVAL</text>
  </g>
  <text x="400" y="308" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" font-weight="600" fill="#00E0D5" letter-spacing="6">STADTPARK OPEN AIR &#183; ASCHAFFENBURG</text>

  <!-- Swoosh underline -->
  <path d="M180 335 Q 400 375 620 325" stroke="#00E0D5" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- ===== FELFOUL VENDOR BANNER ===== -->
  <g transform="translate(400 405)" text-anchor="middle" filter="url(#softShadow)">
    <rect x="-310" y="-38" width="620" height="76" rx="38" fill="url(#ribbon)" stroke="#FFD400" stroke-width="4"/>
    <text y="-4" font-family="Verdana, sans-serif" font-size="13" font-weight="700" fill="#FFD400" letter-spacing="8">POWERED BY</text>
    <text y="24" font-family="'Impact','Arial Black',sans-serif" font-size="40" font-weight="900" fill="#fff" letter-spacing="8">FELFOUL FOODTRUCK</text>
  </g>

  <!-- Badges row -->
  <g transform="translate(400 480)" text-anchor="middle" font-family="Verdana, sans-serif">
    <g>
      <rect x="-215" y="-16" width="80" height="32" rx="16" fill="#7ED957" stroke="#111" stroke-width="2"/>
      <text y="6" x="-175" font-size="12" font-weight="900" fill="#111">VEGAN</text>
    </g>
    <g>
      <rect x="-115" y="-16" width="80" height="32" rx="16" fill="#FFD400" stroke="#111" stroke-width="2"/>
      <text y="6" x="-75" font-size="12" font-weight="900" fill="#111">HALAL</text>
    </g>
    <g>
      <rect x="-15" y="-16" width="140" height="32" rx="16" fill="#FF3EA5" stroke="#111" stroke-width="2"/>
      <text y="6" x="55" font-size="12" font-weight="900" fill="#fff">HAUSGEMACHT</text>
    </g>
    <g>
      <rect x="135" y="-16" width="90" height="32" rx="16" fill="#00E0D5" stroke="#111" stroke-width="2"/>
      <text y="6" x="180" font-size="12" font-weight="900" fill="#111">FRISCH</text>
    </g>
  </g>

  <!-- ===== MENU CARDS ===== -->
  <!-- FALAFEL -->
  <g transform="translate(60 530)" filter="url(#softShadow)">
    <rect x="0" y="0" width="220" height="270" rx="26" fill="url(#cardBg)"/>
    <rect x="0" y="0" width="220" height="270" rx="26" fill="none" stroke="#E63946" stroke-width="5"/>
    <!-- Price tag -->
    <g transform="translate(180 20)">
      <circle cx="0" cy="0" r="30" fill="#E63946" stroke="#FFD400" stroke-width="3"/>
      <text y="6" text-anchor="middle" font-family="'Impact',sans-serif" font-size="20" font-weight="900" fill="#fff">5,50€</text>
    </g>
    <!-- Falafel illustration -->
    <g transform="translate(110 110)">
      <ellipse cx="0" cy="34" rx="60" ry="10" fill="#111" opacity="0.15"/>
      <!-- pita bowl -->
      <path d="M-55 20 Q -60 -5 0 -8 Q 60 -5 55 20 Q 30 30 0 30 Q -30 30 -55 20 Z" fill="#E8C88A" stroke="#111" stroke-width="2"/>
      <!-- Falafel balls -->
      <circle cx="-25" cy="0" r="18" fill="url(#falafel)" stroke="#111" stroke-width="2"/>
      <circle cx="20" cy="5" r="17" fill="url(#falafel)" stroke="#111" stroke-width="2"/>
      <circle cx="-5" cy="-10" r="16" fill="url(#falafel)" stroke="#111" stroke-width="2"/>
      <g fill="#8A5A20" opacity="0.7">
        <circle cx="-30" cy="-4" r="2.5"/>
        <circle cx="-18" cy="6" r="2.5"/>
        <circle cx="20" cy="0" r="2.5"/>
        <circle cx="25" cy="10" r="2.5"/>
        <circle cx="-5" cy="-15" r="2.5"/>
      </g>
      <!-- Parsley -->
      <ellipse cx="-45" cy="-5" rx="10" ry="5" fill="url(#green)" transform="rotate(-30 -45 -5)"/>
      <ellipse cx="45" cy="-8" rx="10" ry="5" fill="url(#green)" transform="rotate(30 45 -8)"/>
    </g>
    <text x="110" y="200" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="34" font-weight="900" fill="#E63946" letter-spacing="3">FALAFEL</text>
    <text x="110" y="225" text-anchor="middle" font-family="Verdana" font-size="12" font-weight="600" fill="#5a3910">im Fladenbrot mit Salat</text>
    <text x="110" y="248" text-anchor="middle" font-family="Verdana" font-size="11" font-weight="500" fill="#7a5a30" font-style="italic">Tahin-, Joghurt- &amp; Chili-Sauce</text>
  </g>

  <!-- DOLMA -->
  <g transform="translate(290 530)" filter="url(#softShadow)">
    <rect x="0" y="0" width="220" height="270" rx="26" fill="url(#cardBg)"/>
    <rect x="0" y="0" width="220" height="270" rx="26" fill="none" stroke="#2E7A3A" stroke-width="5"/>
    <g transform="translate(180 20)">
      <circle cx="0" cy="0" r="30" fill="#2E7A3A" stroke="#FFD400" stroke-width="3"/>
      <text y="6" text-anchor="middle" font-family="'Impact',sans-serif" font-size="20" font-weight="900" fill="#fff">4,50€</text>
    </g>
    <!-- Dolma -->
    <g transform="translate(110 110)">
      <ellipse cx="0" cy="34" rx="60" ry="10" fill="#111" opacity="0.15"/>
      <!-- plate -->
      <ellipse cx="0" cy="20" rx="65" ry="15" fill="#ffffff" stroke="#111" stroke-width="2"/>
      <g stroke="#111" stroke-width="2">
        <ellipse cx="-30" cy="0" rx="14" ry="26" fill="url(#green)" transform="rotate(-18 -30 0)"/>
        <ellipse cx="0" cy="-8" rx="14" ry="28" fill="url(#green)"/>
        <ellipse cx="30" cy="0" rx="14" ry="26" fill="url(#green)" transform="rotate(18 30 0)"/>
      </g>
      <g stroke="#245826" stroke-width="1.5" fill="none" opacity="0.7">
        <path d="M-30 -20 L -30 22"/>
        <path d="M0 -34 L 0 18"/>
        <path d="M30 -20 L 30 22"/>
      </g>
      <!-- Lemon wedge -->
      <path d="M-55 15 Q -45 5 -35 15 Q -45 25 -55 15 Z" fill="#FFD400" stroke="#111" stroke-width="1.5"/>
      <path d="M40 18 Q 50 8 60 18 Q 50 28 40 18 Z" fill="#FFD400" stroke="#111" stroke-width="1.5"/>
    </g>
    <text x="110" y="200" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="34" font-weight="900" fill="#2E7A3A" letter-spacing="3">DOLMA</text>
    <text x="110" y="225" text-anchor="middle" font-family="Verdana" font-size="12" font-weight="600" fill="#1e4d24">gefüllte Weinblätter</text>
    <text x="110" y="248" text-anchor="middle" font-family="Verdana" font-size="11" font-weight="500" fill="#3a6640" font-style="italic">Reis, Kräuter, Zitrone</text>
  </g>

  <!-- SLUSH-EIS -->
  <g transform="translate(520 530)" filter="url(#softShadow)">
    <rect x="0" y="0" width="220" height="270" rx="26" fill="url(#cardBg)"/>
    <rect x="0" y="0" width="220" height="270" rx="26" fill="none" stroke="#7A5CFF" stroke-width="5"/>
    <g transform="translate(180 20)">
      <circle cx="0" cy="0" r="30" fill="#7A5CFF" stroke="#FFD400" stroke-width="3"/>
      <text y="6" text-anchor="middle" font-family="'Impact',sans-serif" font-size="20" font-weight="900" fill="#fff">3,50€</text>
    </g>
    <g transform="translate(110 115)">
      <ellipse cx="0" cy="42" rx="55" ry="8" fill="#111" opacity="0.15"/>
      <!-- cup -->
      <path d="M-38 -35 L -32 42 L 32 42 L 38 -35 Z" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
      <!-- band -->
      <rect x="-36" y="20" width="72" height="10" fill="#FF3EA5" stroke="#111" stroke-width="1.5"/>
      <!-- slush foam -->
      <path d="M-36 -35 Q -22 -52 0 -42 Q 22 -55 36 -35 Q 22 -22 0 -28 Q -22 -25 -36 -35 Z" fill="url(#slush)" stroke="#111" stroke-width="2"/>
      <!-- straw -->
      <rect x="-4" y="-72" width="8" height="85" fill="#FFD400" stroke="#111" stroke-width="2" transform="rotate(10 0 -30)"/>
      <!-- ice sparkles -->
      <g fill="#ffffff" opacity="0.9">
        <circle cx="-12" cy="-14" r="2"/>
        <circle cx="10" cy="-4" r="2"/>
        <circle cx="0" cy="12" r="2"/>
      </g>
    </g>
    <text x="110" y="200" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="30" font-weight="900" fill="#7A5CFF" letter-spacing="2">SLUSH-EIS</text>
    <text x="110" y="225" text-anchor="middle" font-family="Verdana" font-size="12" font-weight="600" fill="#3a2d70">eiskalt &amp; fruchtig</text>
    <text x="110" y="248" text-anchor="middle" font-family="Verdana" font-size="11" font-weight="500" fill="#5a4a90" font-style="italic">Erdbeere · Waldbeere · Cola</text>
  </g>

  <!-- ===== INFO PANEL ===== -->
  <g transform="translate(60 830)">
    <rect x="0" y="0" width="500" height="200" rx="24" fill="#ffffff" opacity="0.1"/>
    <rect x="0" y="0" width="500" height="200" rx="24" fill="none" stroke="#FFD400" stroke-width="2" stroke-dasharray="8 8"/>

    <g font-family="Verdana, sans-serif" fill="#ffffff">
      <text x="30" y="50" font-size="18" font-weight="800" letter-spacing="4" fill="#00E0D5">📍 WO?</text>
      <text x="30" y="80" font-size="22" font-weight="900">Stadtpark Open Air</text>
      <text x="30" y="102" font-size="14" font-weight="600" opacity="0.85">Food Court · Stand 12</text>

      <text x="30" y="140" font-size="18" font-weight="800" letter-spacing="4" fill="#00E0D5">🕒 WANN?</text>
      <text x="30" y="170" font-size="22" font-weight="900">FR &#8211; SO · 12:00 &#8211; 23:00</text>
    </g>
  </g>

  <!-- ===== QR / INSTA CARD ===== -->
  <g transform="translate(580 830)" filter="url(#softShadow)">
    <rect x="0" y="0" width="160" height="200" rx="24" fill="#ffffff"/>
    <rect x="0" y="0" width="160" height="200" rx="24" fill="none" stroke="#FF3EA5" stroke-width="3"/>
    <!-- QR-code placeholder pattern -->
    <g transform="translate(30 20)" fill="#111">
      <rect x="0" y="0" width="100" height="100" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
      <!-- QR pattern (decorative) -->
      <rect x="8" y="8" width="20" height="20" rx="2"/>
      <rect x="12" y="12" width="12" height="12" rx="1" fill="#fff"/>
      <rect x="16" y="16" width="4" height="4" fill="#111"/>
      <rect x="72" y="8" width="20" height="20" rx="2"/>
      <rect x="76" y="12" width="12" height="12" rx="1" fill="#fff"/>
      <rect x="80" y="16" width="4" height="4" fill="#111"/>
      <rect x="8" y="72" width="20" height="20" rx="2"/>
      <rect x="12" y="76" width="12" height="12" rx="1" fill="#fff"/>
      <rect x="16" y="80" width="4" height="4" fill="#111"/>
      <!-- random dots -->
      <rect x="36" y="12" width="6" height="6"/>
      <rect x="46" y="12" width="6" height="6"/>
      <rect x="56" y="20" width="6" height="6"/>
      <rect x="36" y="26" width="6" height="6"/>
      <rect x="52" y="30" width="6" height="6"/>
      <rect x="40" y="40" width="6" height="6"/>
      <rect x="60" y="44" width="6" height="6"/>
      <rect x="30" y="50" width="6" height="6"/>
      <rect x="72" y="52" width="6" height="6"/>
      <rect x="44" y="60" width="6" height="6"/>
      <rect x="66" y="66" width="6" height="6"/>
      <rect x="36" y="72" width="6" height="6"/>
      <rect x="80" y="76" width="6" height="6"/>
      <rect x="52" y="82" width="6" height="6"/>
      <rect x="70" y="88" width="6" height="6"/>
      <rect x="40" y="90" width="6" height="6"/>
    </g>
    <text x="80" y="145" text-anchor="middle" font-family="Verdana" font-size="14" font-weight="900" fill="#111" letter-spacing="1">FOLGE UNS</text>
    <text x="80" y="168" text-anchor="middle" font-family="Verdana" font-size="14" font-weight="700" fill="#FF3EA5">@felfoul63</text>
    <text x="80" y="188" text-anchor="middle" font-family="Verdana" font-size="10" font-weight="600" fill="#777">Instagram</text>
  </g>

  <!-- ===== FOOTER ===== -->
  <g transform="translate(400 1080)" text-anchor="middle" font-family="Verdana, sans-serif" fill="#ffffff">
    <text y="0" font-size="15" font-weight="800" letter-spacing="6" fill="#FFD400">FELFOUL &#183; FALAFEL &#183; DOLMA &#183; SLUSH-EIS</text>
    <text y="22" font-size="11" font-weight="600" letter-spacing="3" opacity="0.85">Würzburger Str. 62 · 63739 Aschaffenburg</text>
  </g>
</svg>
